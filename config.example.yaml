# 跨境实例干净 IP 选择器示例配置。复制为 config.yaml 后按需修改。

# 目标 AWS 区域（默认香港 ap-east-1）
region: ap-east-1
# 探测实例规格
instance_type: t3.nano
# 自定义 AMI，留空则由启动逻辑自动选择
image_id: ''
# 指定子网 ID，留空则使用默认 VPC 的子网
subnet_id: ''
# 指定安全组 ID，留空则自动创建/选择
security_group_id: ''
# 关联的 IAM 实例配置名（用于 SSM），留空则自动准备
instance_profile_name: ''
# 每轮启动的候选实例数量
batch_size: 10
# 最大轮次数，达到即停止
max_rounds: 3
# 每轮结束后全局保留的优胜者数量
keep_top_k: 1
# 综合得分达到该阈值即提前结束
target_score: 90.0
# 判定有效所需的最少可用 backend 数
min_backends: 1
# 等待实例 SSM 上线的超时时间（秒）
ssm_online_timeout_s: 180
# 是否为保留的实例开启终止保护
protect: false
# 各探测 backend 的配置
backends:
  reverse:
    enabled: true
    ping_count: 10
    tcping_count: 5
    tcping_port: 443
    timeout_s: 120
    # 三网回程探测目标（每个 ISP 至少一个）。可写 host 或 host:port；
    # ping 只用 host 部分，tcping 用条目端口（下面纯 IP 是三网 DNS，走 53），域名回退到 tcping_port
    targets:
      telecom:
      - '114.114.114.114:53'
      - www.189.cn
      unicom:
      - '123.123.123.123:53'
      - www.10010.com
      mobile:
      - '221.130.33.52:53'
      - www.10086.cn
  globalping:
    enabled: true
    locations:
    - HK
    - TW
    limit_per_location: 2
    packets: 4
    timeout_s: 60
    # 可选 API token；留空则匿名（250 tests/h），填入后走认证额度（500 tests/h）
    api_token: ''
  ripeatlas:
    enabled: false
    api_key: ''  # 留空则跳过
    probe_count: 10
    packets: 4
    timeout_s: 120
  itdog:
    enabled: false  # 非官方接口，默认关闭
    timeout_s: 30
    # node_id -> isp，默认北京/上海三网 + 深圳电信/移动
    nodes:
      '1310': telecom
      '1273': unicom
      '1250': mobile
      '1227': telecom
      '1254': unicom
      '1249': mobile
      '1169': telecom
      '1290': mobile
# 综合评分权重（backend 权重、三网权重、延迟好/坏阈值）
weights:
  backends:
    reverse: 0.5
    globalping: 0.2
    ripeatlas: 0.15
    itdog: 0.15
  isps:
    telecom: 0.34
    unicom: 0.33
    mobile: 0.33
  lat_good_ms: 60
  lat_bad_ms: 300
# IP 信誉检查数据源配置
reputation:
  dnsbl_zones:
  - zen.spamhaus.org
  - b.barracudacentral.org
  badlist_url: https://raw.githubusercontent.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker/master/_generator_lists/bad-ip-addresses.list
  abuseipdb_api_key: ''  # 留空则跳过
# 结果输出目录
output_dir: ./out
# 历史统计文件路径
history_file: ./history/prefix_stats.json
