<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EC2 网络测量与实例筛选</title>

<style>
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --ink:#1B2430; --muted:#5F6B79; --line:#D9DFE6;
  --accent:#0E7C6E; --accent-ink:#FFFFFF; --accent-soft:#DCEFEB;
  --good:#1E8E4E; --warn:#B8791A; --bad:#B9433B; --good-soft:#DFF3E7; --warn-soft:#F8ECD5; --bad-soft:#F9E1DF;
  --row:#F0F3F6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#161E26; --ink:#E6EBF0; --muted:#98A4B1; --line:#2A3540;
    --accent:#3DB9A6; --accent-ink:#06211D; --accent-soft:#173630;
    --good:#4CC37A; --warn:#E0A23E; --bad:#E06A62; --good-soft:#153524; --warn-soft:#3A2C12; --bad-soft:#3E1D1B;
    --row:#1C262F;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#161E26; --ink:#E6EBF0; --muted:#98A4B1; --line:#2A3540;
  --accent:#3DB9A6; --accent-ink:#06211D; --accent-soft:#173630;
  --good:#4CC37A; --warn:#E0A23E; --bad:#E06A62; --good-soft:#153524; --warn-soft:#3A2C12; --bad-soft:#3E1D1B;
  --row:#1C262F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "IBM Plex Sans",system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
code,.mono,td.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.01em}
header .region{margin-left:auto;color:var(--muted);font-size:13px}
header .region b{color:var(--ink);font-weight:600}
.demo-banner{background:#7A5B00;color:#FFE9AE;font-weight:600;font-size:13px;padding:8px 28px;letter-spacing:.02em}
.errbar{background:var(--bad-soft);color:var(--bad);padding:10px 28px;font-size:13px;font-weight:500;display:flex;gap:12px;align-items:center}
.errbar button{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:24px;padding:22px 28px;max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:1080px){main{grid-template-columns:1fr}}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.step-desc{color:var(--muted);font-size:13px;margin:0 0 18px}
/* 步骤导航 */
nav.steps{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;position:sticky;top:16px}
nav.steps ol{list-style:none;margin:0;padding:0}
nav.steps li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--muted);font-size:13px}
nav.steps li .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:600;flex:none}
nav.steps li.done{color:var(--ink);cursor:pointer}
nav.steps li.done .n{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
nav.steps li.active{color:var(--ink);font-weight:600;background:var(--row)}
nav.steps li.active .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.steps li.done:hover{background:var(--row)}
/* 卡片/tile */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .v{font-size:20px;font-weight:600;margin-top:4px;word-break:break-all}
.tile .v.small{font-size:15px}
.tile.accent{background:var(--accent-soft);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-all}
.problems{list-style:none;margin:12px 0 0;padding:0}
.problems li{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:9px 12px;margin-bottom:8px;font-size:13px}
.badge-note{display:inline-block;margin-left:8px;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:500;vertical-align:middle}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
/* 表格 */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;background:var(--row)}
th.sortable{cursor:pointer;user-select:none}
th.sortable .arrow{color:var(--accent)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
tr.winner td{background:var(--accent-soft)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--row);color:var(--muted)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
.score .bar{width:70px;height:6px;border-radius:3px;background:var(--row);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--accent)}
.score .bar i.low{background:var(--bad)}
.score .bar i.mid{background:var(--warn)}
/* 表单 */
.form-grid{display:grid;grid-template-columns:1fr 300px;gap:22px}
@media (max-width:820px){.form-grid{grid-template-columns:1fr}}
.inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.inst{border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;background:var(--surface)}
.inst.sel{border-color:var(--accent);background:var(--accent-soft)}
.inst .t{font-weight:600;font-family:"IBM Plex Mono",monospace}
.inst .m{font-size:12px;color:var(--muted);margin-top:3px}
.numrow{display:grid;grid-template-columns:150px 90px 1fr;gap:10px 14px;align-items:center;margin:10px 0}
.numrow label{font-size:13px}
.numrow .hint{font-size:12px;color:var(--muted)}
.numrow input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex;gap:9px;align-items:flex-start;margin:9px 0}
.chk label{font-size:13px}
.chk .hint{font-size:12px;color:var(--muted);display:block}
.chk.off{opacity:.55}
.est{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;position:sticky;top:16px}
.est .big{font-size:24px;font-weight:600;margin:4px 0 2px}
pre.summary,pre.cmd{margin:0;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
/* 运行中 */
.progress{height:10px;border-radius:999px;background:var(--row);overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.round-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;margin-bottom:10px}
.round-card h4{margin:0 0 8px;font-size:13px;font-weight:600}
.round-card .line{font-size:13px;margin:3px 0;color:var(--muted)}
.round-card .line b{color:var(--ink)}
.iplist{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.log{background:#0B1117;color:#C7D2DC;border-radius:8px;padding:12px 14px;height:220px;overflow:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;margin-top:12px}
/* winner 卡片 */
.win-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.win-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:15px 17px}
.win-card.top{border-color:var(--accent)}
.win-card .ip{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600}
.win-card .meta{font-size:12px;color:var(--muted);margin:3px 0 10px;font-family:"IBM Plex Mono",monospace}
.win-card .isp{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;font-size:12px;align-items:center;margin-bottom:12px}
.win-card .isp .bar{width:100%;height:6px;border-radius:3px;background:var(--row);overflow:hidden}
.win-card .isp .bar i{display:block;height:100%;background:var(--accent)}
.win-card .isp .bar i.low{background:var(--bad)}
.win-card .isp .bar i.mid{background:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.notes{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.notes li{margin-bottom:6px}
.empty{color:var(--muted);padding:16px}
/* 侧栏历史 */
aside.hist{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;position:sticky;top:16px}
aside.hist h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.run-item{border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-bottom:8px;cursor:pointer;font-size:12.5px}
.run-item:hover{background:var(--row)}
.run-item.cur{border-color:var(--accent)}
.run-item .rid{font-family:"IBM Plex Mono",monospace;font-size:11.5px;word-break:break-all}
.run-item .sub{color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* 选机弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;max-width:520px;width:100%}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .list{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0;max-height:140px;overflow:auto;white-space:pre-wrap}
footer{padding:14px 28px 28px;color:var(--muted);font-size:12px;text-align:center}
#aws-identity{margin-bottom:6px;word-break:break-all}#aws-identity .warn{color:var(--warn)}#aws-identity code{font-size:12px}
[hidden]{display:none!important}
/* Compact layout: primary fields first, details on demand. */
main{display:block;max-width:1040px;padding:24px;margin:0 auto}
nav.steps{position:static;border:0;background:none;padding:0;margin-bottom:22px}
nav.steps ol{display:flex;gap:8px;flex-wrap:wrap}
nav.steps li{padding:6px 12px}
h2{font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:500}
.field input,.field select,td input,td select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.inline{display:flex;gap:8px;align-items:center}.inline input{flex:1;min-width:0}
.combo{position:relative;min-width:0;flex:1}
.combo input{padding-right:38px}
.combo-toggle{position:absolute;right:1px;top:1px;bottom:1px;width:36px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:5px;font:inherit}
.combo-menu{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:25;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 8px 24px #0002;display:flex;flex-direction:column;max-height:360px;overflow:hidden}
.combo-menu.above{top:auto;bottom:calc(100% + 5px)}
.combo-list{overflow-y:auto;overscroll-behavior:contain;min-height:0;scrollbar-gutter:stable;padding:4px}
.combo-option{padding:9px 10px;border-radius:5px;cursor:pointer;white-space:normal;overflow-wrap:anywhere}
.combo-option:hover,.combo-option.active{background:var(--accent-soft)}
.combo-option strong{display:block;font-weight:600}
.combo-option small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.combo-count{padding:7px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex:none}
.image-detail{font-size:12px;color:var(--muted);white-space:normal;overflow-wrap:anywhere;margin:5px 0 0}
.image-cell{min-width:245px;max-width:420px}
.launch-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:12px;align-items:start;margin-bottom:14px}
.launch-row .remove-group{margin-top:29px}
.quantity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.quantity-value{padding:7px 0;font-size:22px;font-weight:600}
.catalog-status{padding:10px 12px;background:var(--row);border-radius:6px;overflow-wrap:anywhere}
.catalog-status.error{background:var(--warn-soft);color:var(--ink)}
@media(max-width:640px){.quantity-grid{grid-template-columns:1fr}}
@media(max-width:640px){.launch-row{grid-template-columns:minmax(0,1fr) 80px}.launch-row .remove-group{grid-column:1/-1;margin:0;justify-self:end}}
.hint,.compact-note{font-size:12px;color:var(--muted)}
.compact-note{margin:12px 0}.field .hint{margin:0}
details.card>summary,details.hist>summary{cursor:pointer;font-weight:500;padding:2px 0}
details.card[open]>summary,details.hist[open]>summary{margin-bottom:16px}
details.hist{padding:16px 0;border-top:1px solid var(--line);margin-top:28px}
#est{border:0;background:none;padding:0;margin:12px 0}
@media(max-width:640px){main{padding:16px}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}header{padding:16px}nav.steps li{padding:5px 7px}}
</style>
</head>
<body>
<header>
  <h1>EC2 网络测量与实例筛选</h1>
  <div class="region">区域 <b id="region-label">—</b></div>
</header>
<div id="demo-banner" class="demo-banner" hidden>演示模式，不接触 AWS。以下为模拟数据，用于演练完整流程。</div>
<div id="errbar" class="errbar" hidden><span id="errmsg"></span><button class="btn" id="err-x" type="button">关闭</button></div>

<main>
  <nav class="steps"><ol id="stepnav"></ol></nav>
  <div id="content"></div>
  <details class="hist">
    <summary>历史运行 <span id="hist-count" class="badge-note" hidden></span></summary>
    <div id="hist-list"><div class="empty">暂无运行记录</div></div>
  </details>
</main>
<footer><div id="aws-identity" class="hint" aria-live="polite">AWS 凭证：读取中…</div><div id="service-note">默认仅监听本机，使用本机 AWS 凭证。费用为参考估算，实际以账单为准。</div></footer>

<div id="modal-root"></div>

<script>
"use strict";
// ---------- 常量与工具 ----------
const STEPS = ["环境检查","配置参数","确认计划","运行中","结果与选机","完成"];
const STOP = {target_score_reached:"达到目标分",max_rounds:"轮次用尽",no_qualified:"无合格候选",
              cancelled:"已取消（保留已测实例）",launch_failed:"后续轮次启动失败，保留已测实例"};
const VETO = {reputation_unavailable:"GitHub 名单检查失败",reputation:"命中 IP 信誉名单",reverse_unreachable:"所有反向探测目标均未响应",
              reverse_unavailable:"反向探测失败",reverse_incomplete:"反向探测未覆盖全部配置运营商",
              unreachable:"所有探测均未收到响应",min_backends:"有效探测源不足",no_public_ip:"无公网 IP"};
const ISP_CN = {telecom:"电信",unicom:"联通",mobile:"移动"};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => (v === null || v === undefined || v === "") ? "—" : (typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toFixed(1)) : String(v));
const money = v => (v == null ? "—" : "估算 $" + Number(v).toFixed(3));
const duration = p => (p.estimated_minutes_range || [p.estimated_minutes]).join("～");
const cost = p => p.estimated_cost_range_usd
  ? "$" + p.estimated_cost_range_usd.map(v => Number(v).toFixed(3)).join("～$")
  : "暂无该区域或机型报价";
const runRegion = () => (state.runDetail && state.runDetail.region) || (state.report && state.report.region) || state.region;

const state = {
  step: 2, reached: 2, demo: false, region: "ap-east-1", regions: [], optionsSeq: 0, loading: false,
  optionsKey: "", optionsError: "", optionsController: null, typeSpecs: {},
  options: null, env: null, form: null, plan: null,
  runId: null, runDetail: null, report: null, selection: null, runState: null,
  es: null, pollTimer: null, timerId: null, runStartMs: 0,
  rounds: [], logLines: [], maxRounds: 3, planTimer: null,
  sort: {key:"composite", dir:-1}, following: false,
  images: null, imageKey: "", imageSeq: 0, imageTimer: null, imageStatus: "",
  imageChoice: "auto", instanceImageChoices: [],
};

async function api(path, opts){
  const res = await fetch(path, opts);
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || res.statusText || ("HTTP " + res.status));
  return data;
}
const post = (path, obj) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(obj || {})});

function showError(msg){ $("#errmsg").textContent = String(msg); $("#errbar").hidden = false; }
function clearError(){ $("#errbar").hidden = true; }
$("#err-x").addEventListener("click", clearError);

// ---------- 导航渲染 ----------
function renderNav(){
  const ol = $("#stepnav");
  ol.innerHTML = [[2,"配置"],[3,"确认"],[4,"运行"],[5,"结果"]].map(([n,label],i) => {
    const cls = (n === state.step || (n === 5 && state.step === 6)) ? "active" : (n <= state.reached ? "done" : "todo");
    return `<li class="${cls}" data-step="${n}"><span class="n">${i+1}</span><span>${esc(label)}</span></li>`;
  }).join("");
  ol.querySelectorAll("li.done").forEach(li => li.addEventListener("click", () => {
    const n = Number(li.dataset.step);
    if (n !== state.step) goStep(n);
  }));
  $("#region-label").textContent = state.step >= 4 ? runRegion() : state.region;
}

function goStep(n){
  if (n === 1) n = 2;
  state.step = n;
  state.reached = Math.max(state.reached, n);
  renderNav();
  clearError();
  const mounts = {1:mountEnv, 2:mountConfig, 3:mountConfirm, 4:mountRunning, 5:mountResult, 6:mountDone};
  (mounts[n] || (()=>{}))();
}

// ---------- 配置 ----------
function catalogKey(){return state.region+"|"+(state.form?.subnet_id || "");}
function typeDescription(t){
  return t.vcpu!=null && t.memory_gib!=null ? `${t.vcpu} vCPU · ${t.memory_gib} GiB 内存 · ${t.arch}` : "选择后查询 CPU、内存和架构";
}
function refreshCatalogView(){
  const status=$("#catalog-status"), count=state.options?.instance_types?.length || 0;
  if(status){
    status.classList.toggle("error",!!state.optionsError);
    status.textContent=state.loading ? (count ? `正在刷新 AWS 机型，暂显示上次查询的 ${count} 项…` : "正在从 AWS 加载机型名称…") :
      state.optionsError ? (count ? `刷新失败，显示上次查询的 ${count} 个机型。` : "机型列表加载失败。")+" "+state.optionsError :
      count ? `已加载 ${count} 个 AWS 机型${state.options.availability_zone ? " · "+state.options.availability_zone : ""}。输入可筛选，选择后显示规格。` :
      "AWS 未返回该区域或子网的机型，请检查区域和子网设置。";
  }
  const button=$("#reload-options");if(button){button.disabled=state.loading;button.textContent=state.loading?"加载中…":"重新加载机型";}

  $("#reload-options").addEventListener("click", reloadOptions);

  $("#volume-encrypted").addEventListener("change", e => { f.root_volume_encrypted=e.target.checked; schedulePlan(); });
  $("#c-protect").addEventListener("change", e => { f.protect=e.target.checked; schedulePlan(); });
  for (const b of state.options.backends) $("#b-"+b.name).addEventListener("change", e => { f.backends[b.name]=e.target.checked; schedulePlan(); });
  $("#cfg-next").addEventListener("click", async () => {
    const invalid=[...document.querySelectorAll("#content input")].find(input=>!input.checkValidity());
    if(invalid){
      let section=invalid.closest("details");while(section){section.open=true;section=section.parentElement.closest("details");}

  renderGroups();renderInstanceRows(); updateTotal();refreshCatalogView();requestImages(true); schedulePlan();
}

  }).join("");
  bindImageControls(rows);
  rows.querySelectorAll("[data-key]").forEach(input=>input.addEventListener("input",e=>{

async function refreshCapacity(){

}
function schedulePlan(){ clearTimeout(state.planTimer); state.planTimer=setTimeout(refreshPlan,400); }
async function refreshPlan(){

// ---------- ④ 运行中 ----------
function startRun(id, maxRounds){
  state.runDetail = null; state.report = null; state.selection = null; state.reached = 4;
  state.runId = id; state.maxRounds = maxRounds || state.maxRounds;
  state.rounds = []; state.logLines = []; state.runStartMs = Date.now(); state.following = true;
  state.runState = "running";
  goStep(4);
  connectSSE(id);
}
function mountRunning(){
  $("#content").innerHTML = `
    <h2>正在测量</h2>
    <p class="step-desc">运行 <span class="mono">${esc(state.runId || "")}</span>；完成后自动进入结果页。关闭页面不影响后台运行，可从历史记录恢复。</p>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>进度：<b id="prog-txt">0 / ${state.maxRounds} 轮</b></div>
        <div class="mono">已用时 <b id="timer">0:00</b></div>
      </div>
      <div class="progress"><i id="prog-bar" style="width:0%"></i></div>
      <div class="actions" style="margin-top:8px">
        <button class="btn danger" id="run-cancel" type="button">取消运行</button>
        <span id="run-note" class="pill neutral" hidden></span>
      </div>
    </div>
    <div id="rounds-box"></div>
    <div id="fail-box"></div>
    <details class="card"><summary>运行日志</summary><div class="log" id="log"></div></details>`;
  const cancelBtn = $("#run-cancel");
  if (state.runState && state.runState !== "running"){
    cancelBtn.hidden = true;  // run 已结束：不再提供「取消运行」
  } else {
    cancelBtn.addEventListener("click", async () => {
      if (!confirm("确认取消？当前轮结束后停止，已保留的实例会继续运行。")) return;
      try { await post(`/api/runs/${state.runId}/cancel`); setNote("已请求取消，当前轮结束后停止"); }
      catch(e){ showError("取消失败：" + e.message); }
    });
  }
  renderRounds(); renderLog(); updateProgress();
  clearInterval(state.timerId);
  state.timerId = setInterval(updateTimer, 1000); updateTimer();
}
function setNote(t){ const n = $("#run-note"); if (n){ n.textContent = t; n.hidden = false; } }
function updateTimer(){
  const t = $("#timer"); if (!t){ clearInterval(state.timerId); return; }
  const s = Math.max(0, Math.floor((Date.now() - state.runStartMs) / 1000));
  t.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function updateProgress(){
  const done = state.rounds.filter(r => r.done).length;
  const pct = state.maxRounds ? Math.min(100, done / state.maxRounds * 100) : 0;
  const bar = $("#prog-bar"), txt = $("#prog-txt");
  if (bar) bar.style.width = pct + "%";
  if (txt) txt.textContent = `${done} / ${state.maxRounds} 轮`;
}
function roundOf(n){
  let r = state.rounds.find(x => x.round === n);
  if (!r){ r = {round:n, batch_size:0, candidates:[], vetoed:[], kept:[], terminated:0, done:false}; state.rounds.push(r); state.rounds.sort((a,b)=>a.round-b.round); }
  return r;
}
function applyEvent(ev){
  if (ev.type === "log" || ev.type === "cancelled"){ pushLog(ev.message); if (ev.type==="cancelled") setNote("已请求取消，当前轮结束后停止"); }
  else if (ev.type === "round_started"){ roundOf(ev.round).batch_size = ev.batch_size; }
  else if (ev.type === "candidates"){ roundOf(ev.round).candidates = ev.items || []; }
  else if (ev.type === "vetoed"){ roundOf(ev.round).vetoed = ev.items || []; }
  else if (ev.type === "round_done"){ const r = roundOf(ev.round); r.kept = ev.kept || []; r.terminated = (ev.terminated || []).length; r.done = true; }
  else if (ev.type === "finished"){ state.runState = ev.stop_reason === "cancelled" ? "cancelled" : "finished"; onFinished(ev); return; }
  else if (ev.type === "failed"){ state.runState = "failed"; showFailed(ev.message, ev.leftover_instance_ids ?? null, ev.winner_instance_ids || []); return; }
  if (state.step === 4){ renderRounds(); renderLog(); updateProgress(); }
}
function pushLog(m){ if (m == null) return; state.logLines.push(String(m)); if (state.logLines.length > 500) state.logLines = state.logLines.slice(-500); }
function renderLog(){ const box = $("#log"); if (!box) return; box.textContent = state.logLines.join("\n"); box.scrollTop = box.scrollHeight; }
function renderRounds(){
  const box = $("#rounds-box"); if (!box) return;
  box.innerHTML = state.rounds.map(r => {
    const cand = r.candidates.length, veto = r.vetoed.length;
    const vetoTxt = veto ? r.vetoed.map(v => `${esc(v.public_ip)}（${esc(VETO[v.reason] || v.reason)}）`).join("、") : "无";
    const keptTxt = r.kept.length ? r.kept.map(k => `${esc(k.public_ip)} · ${fmt(k.composite)}`).join("、") : "无";
    return `<div class="round-card"><h4>第 ${r.round} 轮${r.done ? "" : "（进行中）"}</h4>
      <div class="line">启动 <b>${r.batch_size || cand}</b> 台 → 否决 <b>${veto}</b> 台：<span class="iplist">${vetoTxt}</span></div>
      <div class="line">保留：<span class="iplist">${keptTxt}</span></div>
      <div class="line">终止 <b>${r.terminated}</b> 台</div></div>`;
  }).join("") || `<div class="empty">等待第一轮启动…</div>`;
}
function connectSSE(id){
  closeStreams();
  let es;
  try { es = new EventSource(`/api/runs/${id}/events`); }
  catch(e){ startPolling(id); return; }
  state.es = es;
  es.onmessage = e => { try { applyEvent(JSON.parse(e.data)); } catch(_){} };
  es.onerror = () => { es.close(); state.es = null; if (state.following) startPolling(id); };
}
function startPolling(id){
  if (state.pollTimer) return;
  pushLog("[前端] 实时连接中断，改为每 3 秒查询一次状态");
  if (state.step === 4) renderLog();
  const tick = async () => {
    let d;
    try { d = await api(`/api/runs/${id}`); } catch(e){ return; }
    state.rounds = []; state.logLines = state.logLines.filter(l => l.startsWith("[前端]"));
    (d.events || []).forEach(applyEventQuiet);
    if (state.step === 4){ renderRounds(); renderLog(); updateProgress(); }
    if (d.state && d.state !== "running"){
      clearInterval(state.pollTimer); state.pollTimer = null;
      state.runState = d.state;
      if (d.state === "failed" || d.state === "unknown") showFailed(d.error || "运行状态未知，请查询或清理残留实例。", d.leftover_instance_ids ?? null, (d.winners || []).map(w => w.instance_id));
      else { state.runDetail = d; onFinished({stop_reason:d.stop_reason, winners:d.winners}); }
    }
  };
  state.pollTimer = setInterval(tick, 3000); tick();
}
function applyEventQuiet(ev){ if (ev.type !== "finished" && ev.type !== "failed") applyEvent(ev); }
function closeStreams(){
  if (state.es){ state.es.close(); state.es = null; }
  if (state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
}
function onFinished(){
  state.following = false; closeStreams(); clearInterval(state.timerId);
  enterResult(state.runId);
  refreshHistory();
}
function showFailed(message, leftover, winners){
  state.following = false; closeStreams(); clearInterval(state.timerId);
  if (state.step !== 4) goStep(4);
  const box = $("#fail-box"); if (!box) return;
  winners = winners || [];
  const unknown = leftover == null;
  const canClean = !!state.runId && (unknown || leftover.length > 0);
  const winnerHtml = winners.length
    ? `<p style="font-size:13px">已标记为保留的实例（清理会排除这些实例；保护状态需单独核查）：</p><div class="iplist">${winners.map(esc).join(", ")}</div>`
    : "";
  box.innerHTML = `<div class="card" style="border-color:var(--bad)">
    <h3 style="color:var(--bad)">运行失败</h3>
    <p style="font-size:13px">${esc(message || "未知错误")}</p>
    ${winnerHtml}
    ${unknown ? `<p>尚未确认 AWS 上的残留实例。可按本次运行 ID 查询并清理。</p>` : leftover.length ? `<p style="font-size:13px">遗留实例（未终止）：</p><div class="iplist">${leftover.map(esc).join(", ")}</div>` : `<p style="font-size:13px">查询时没有发现待清理实例。</p>`}
    <div class="actions"><button class="btn danger" id="fail-clean" type="button"${canClean ? "" : " disabled"}>查询并清理本次候选</button>
      <button class="btn" id="fail-home" type="button">返回首页重新配置</button>
      <span id="clean-note" class="pill neutral" hidden></span></div>
    <p class="hint">容量不足（InsufficientInstanceCapacity）时工具已自动尝试同 VPC 其他可用区的子网；仍失败可换机型、换区域，或在高级设置指定其他可用区的子网。</p>
  </div>`;
  const home = $("#fail-home");
  if (home) home.addEventListener("click", () => { state.runId = null; state.runState = null; goStep(2); });
  const btn = $("#fail-clean");
  if (btn && canClean) btn.addEventListener("click", async () => {
    const targets = !unknown && leftover.length ? leftover.join("、") : "本次运行中未标记为保留的候选实例";
    if (!confirm(`将终止本次运行的遗留实例：${targets}。此操作不可逆，确认清理？`)) return;
    btn.disabled = true; btn.textContent = "清理中…";
    try { const r = await post("/api/cleanup", {run_id: state.runId});
      const note = $("#clean-note"); note.hidden = false; note.textContent = `已终止 ${r.terminated.length} 台：${r.terminated.join(", ") || "无"}`;
    } catch(e){ showError("清理失败：" + e.message); btn.disabled = false; btn.textContent = "立即清理"; }
  });
  refreshHistory();
}

// ---------- ⑤ 结果与选机 ----------
async function enterResult(id){
  state.runId = id; state.step = 5; state.reached = Math.max(state.reached, 5); renderNav();
  $("#content").innerHTML = `<h2>选择保留实例</h2><div class="empty">正在载入报告…</div>`;
  try {
    const detail = await api(`/api/runs/${id}`);
    const report = await api(`/api/runs/${id}/report.json`);
    if (state.runId !== id) return;
    state.runDetail = detail; state.report = report; state.selection = detail.selection || null;
    renderNav();
  } catch(e){ showError("载入报告失败：" + e.message); $("#content").innerHTML = `<div class="empty">载入报告失败。</div>`; return; }
  mountResult();
}
function mountResult(){
  const c = $("#content"); const d = state.report;
  if (!d){ c.innerHTML = `<div class="empty">尚无报告数据。</div>`; return; }
  const winners = d.winners || [];
  const selected = (state.runDetail && state.runDetail.selection) || null;
  state.selection = selected;
  const terminated = new Set((selected && selected.terminated) || []);
  const tiles = [
    ["停止原因", STOP[d.stop_reason] || d.stop_reason || "—"],
    ["完成轮次", d.rounds_completed],
    ["候选总数", (d.candidates || []).length],
    ["测量结束时保留数", winners.length],
  ];
  let winnerHtml;
  if (winners.length){
    winnerHtml = `<div class="win-grid">${winners.map((w, i) => {
      const s = w.isp_scores || {};
      const isp = ["telecom","unicom","mobile"].map(k => `<span>${ISP_CN[k]}</span>${scoreBar(s[k])}<span class="num">${fmt(s[k])}</span>`).join("");
      return `<div class="win-card${i===0?" top":""}">
        <div class="ip">${esc(w.public_ip)}</div>
        <p class="compact-note">${esc(badlistSummary(w))}</p><div class="meta">${esc(w.instance_type || "")} · ${esc(w.instance_id)} · ${esc(w.prefix || "")} · 第 ${fmt(w.round)} 轮</div>
        <details><summary class="compact-note">运营商分项</summary><div class="isp">${isp}</div></details>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span>综合分 <b>${fmt(w.composite)}</b></span>
          ${selected
            ? (terminated.has(w.instance_id) ? `<span class="pill neutral">已终止</span>` : selected.selected === w.instance_id ? `<span class="pill good">已选定</span>` : `<span class="pill neutral">未选定</span>`)
            : `<button class="btn primary" data-sel="${esc(w.instance_id)}" type="button">选定这台</button>`}
        </div></div>`;
    }).join("")}</div>`;
  } else {
    winnerHtml = `<div class="card"><h3>本次没有合格候选</h3>
      <p class="step-desc">请先查看下方检查详情，区分名单命中、探测失败、目标未响应和数据覆盖不足，再调整配置重试。</p>
      <div class="actions"><button class="btn primary" id="res-reconfig" type="button">回到配置重新运行</button></div></div>`;
  }
  const selectedBanner = selected
    ? `<div class="card" style="border-color:var(--accent)"><h3>已选定 ${esc(selected.selected)}</h3>
        <p class="step-desc">本次运行已记录最终选择。可在完成页查看保护设置和清理结果。</p>
        <div class="actions"><button class="btn primary" id="res-done" type="button">进入完成页</button></div></div>`
    : "";
  c.innerHTML = `
    <h2>选择保留实例</h2>
    <p class="step-desc">按本次测量比较候选。分数不代表长期质量或业务可用性。选定时可选择终止其他实例；终止操作不可恢复。报告保留测量结束时的快照，后续终止状态单独记录。</p>
    <div class="tiles" style="margin-bottom:18px">${tiles.map(([k,v]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v small">${esc(String(v == null ? "—" : v))}</div></div>`).join("")}</div>
    ${selectedBanner}
    <section style="margin-bottom:22px"><h2>保留候选</h2>${winnerHtml}</section>
    <details class="card"><summary>全部候选</summary><div class="tablewrap" id="cand-table"></div></details>
    <details class="card"><summary>网段统计</summary><div class="tablewrap" id="pfx-table"></div></details>
    <details class="card"><summary>探测与信誉详情</summary>${diagnostics(d.candidates || [])}</details>`;
  c.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", () => openSelectModal(b.dataset.sel)));
  const rc = $("#res-reconfig"); if (rc) rc.addEventListener("click", () => goStep(2));
  const rd = $("#res-done"); if (rd) rd.addEventListener("click", () => goStep(6));
  renderCandTable(); renderPfxTable();
}
function scoreBar(v){
  if (v == null) return `<span class="bar"></span>`;
  const cls = v >= 85 ? "" : (v >= 60 ? "mid" : "low");
  return `<span class="bar"><i class="${cls}" style="width:${Math.max(0,Math.min(100,v))}%"></i></span>`;
}
function statusCell(c){
  if (state.selection && (state.selection.terminated || []).includes(c.instance_id)) return `<span class="pill neutral">已终止</span>`;
  if (c.kept) return `<span class="pill good">测量后保留</span>`;
  if (c.qualified === true) return `<span class="pill neutral">合格，未保留</span>`;
  const r = c.veto_reason || "未合格";
  return `<span class="pill bad">${esc(VETO[r] || r)}</span>`;
}
function badlistSummary(candidate){
  const result=(candidate.reputation_results || []).find(r=>r.source === "badlist");
  if(!result) return "GitHub IP 名单：未记录";
  return "GitHub IP 名单：" + ({clear:"未命中",listed:"命中，已排除",unknown:"检查失败"}[result.status] || "未知");
}
function diagnostics(candidates){
  const statuses = {clear:"所查名单未命中", listed:"命中信誉名单", unknown:"信誉检查未完成"};
  return candidates.map(c => `<details class="card"><summary>${esc(c.public_ip)} · ${esc(statuses[c.reputation_status] || "旧报告未记录检查状态")}</summary>
    ${c.image_id ? `<p>镜像 ${esc(c.image_id)} · 系统盘 ${esc(c.root_volume.VolumeSize)} GiB ${esc(c.root_volume.VolumeType)}</p>` : ""}
    ${(c.reputation_results || []).map(r => `<p>${esc(r.source === "badlist" ? "GitHub IP 名单" : r.source)}：${esc(statuses[r.status] || r.status)} ${esc(r.detail || "")} ${r.error && r.error !== r.detail ? esc(r.error) : ""}</p>`).join("")}
    ${(c.probe_results || []).map(pr => `<h4>${esc(pr.backend)}</h4>${pr.error ? `<p>${esc(pr.error)}</p>` : ""}
      <div class="tablewrap"><table><thead><tr><th>运营商/地区</th><th>目标</th><th>方法</th><th>接收/发送</th><th>丢包率</th><th>平均时延 (ms)</th></tr></thead><tbody>
      ${(pr.probes || []).map(p => `<tr><td>${esc(ISP_CN[p.isp] || p.isp)}</td><td>${esc(p.target)}</td><td>${esc(p.method)}</td><td>${p.received}/${p.sent}</td><td>${fmt(p.loss * 100)}%</td><td>${fmt(p.mean_rtt_ms)}</td></tr>`).join("")}</tbody></table></div>`).join("")}
    ${c.probe_results ? "" : "<p>此报告没有保存探测明细。</p>"}</details>`).join("");
}
function renderCandTable(){
  const box = $("#cand-table"); if (!box) return;
  const isp = c => c.isp_scores || {};
  // 三网「分」取 isp_scores（评分），三网「RTT」取 reverse_*（原始时延 ms），二者含义不同
  const cols = [
    {k:"round", label:"轮次", sortable:true, num:true, get:c=>c.round, td:c=>`<td class="num">${fmt(c.round)}</td>`},
    {k:"public_ip", label:"公网 IP", sortable:true, get:c=>c.public_ip, td:c=>`<td class="mono">${esc(c.public_ip)}</td>`},
    {k:"prefix", label:"网段（CIDR）", sortable:true, get:c=>c.prefix, td:c=>`<td class="mono">${esc(c.prefix)}</td>`},
    {k:"composite", label:"综合分", sortable:true, num:true, get:c=>c.composite, td:c=>`<td class="num">${c.qualified ? fmt(c.composite) : "—"}</td>`},
    {k:"status", label:"状态", sortable:false, get:()=>null, td:c=>`<td>${statusCell(c)}</td>`},
    {k:"score_telecom", label:"电信分", sortable:true, num:true, get:c=>isp(c).telecom, td:c=>`<td class="num">${fmt(isp(c).telecom)}</td>`},
    {k:"score_unicom", label:"联通分", sortable:true, num:true, get:c=>isp(c).unicom, td:c=>`<td class="num">${fmt(isp(c).unicom)}</td>`},
    {k:"score_mobile", label:"移动分", sortable:true, num:true, get:c=>isp(c).mobile, td:c=>`<td class="num">${fmt(isp(c).mobile)}</td>`},
    {k:"reverse_telecom", label:"电信平均时延 (ms)", sortable:true, num:true, get:c=>c.reverse_telecom, td:c=>`<td class="num">${fmt(c.reverse_telecom)}</td>`},
    {k:"reverse_unicom", label:"联通平均时延 (ms)", sortable:true, num:true, get:c=>c.reverse_unicom, td:c=>`<td class="num">${fmt(c.reverse_unicom)}</td>`},
    {k:"reverse_mobile", label:"移动平均时延 (ms)", sortable:true, num:true, get:c=>c.reverse_mobile, td:c=>`<td class="num">${fmt(c.reverse_mobile)}</td>`},
  ];
  const s = state.sort;
  const arrow = k => k === s.key ? (s.dir < 0 ? " ▼" : " ▲") : "";
  const head = cols.map(col => col.sortable
    ? `<th class="sortable${col.num?" num":""}" data-key="${col.k}">${esc(col.label)}<span class="arrow">${arrow(col.k)}</span></th>`
    : `<th>${esc(col.label)}</th>`).join("");
  const sortCol = cols.find(col => col.k === s.key && col.sortable) || cols[0];
  const rows = (state.report.candidates || []).slice().sort((a,b) => {
    const va = sortCol.get(a), vb = sortCol.get(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1; if (vb == null) return -1;
    if (typeof va === "number" && typeof vb === "number") return (va - vb) * s.dir;
    return String(va).localeCompare(String(vb)) * s.dir;
  });
  const body = rows.length
    ? rows.map(c => `<tr${c.kept?' class="winner"':''}>${cols.map(col => col.td(c)).join("")}</tr>`).join("")
    : `<tr><td colspan="${cols.length}" class="empty">无候选数据</td></tr>`;
  box.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  box.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.key;
    if (state.sort.key === k) state.sort.dir *= -1; else state.sort = {key:k, dir:-1};
    renderCandTable();
  }));
}
function renderPfxTable(){
  const box = $("#pfx-table"); if (!box) return;
  const pfx = Object.entries(state.report.prefixes || {}).sort((a,b) => b[1].best_composite - a[1].best_composite);
  const body = pfx.length ? pfx.map(([p,v]) => `<tr><td class="mono">${esc(p)}</td><td class="num">${v.samples}</td><td class="num">${fmt(v.mean_composite)}</td><td class="num">${fmt(v.best_composite)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">无网段统计</td></tr>`;
  box.innerHTML = `<table><thead><tr><th>网段（CIDR）</th><th class="num">样本</th><th class="num">均值</th><th class="num">最高</th></tr></thead><tbody>${body}</tbody></table>`;
}
function openSelectModal(instanceId){
  const winners = (state.report.winners || []).map(w => w.instance_id);
  const others = winners.filter(x => x !== instanceId);
  const defProtect = !!(state.runDetail && state.runDetail.config && state.runDetail.config.protect);
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay"><div class="modal">
    <h3>选定 ${esc(instanceId)}</h3>
    <p style="font-size:13px;color:var(--muted)">确认后将记录该实例为本次最终选择。以下为本次其余保留候选：</p>
    <div class="list">${others.length ? others.map(esc).join("\n") : "（无其它保留候选）"}</div>
    <div class="chk"><input id="m-term" type="checkbox"${others.length ? " checked" : ""}${others.length ? "" : " disabled"}>
      <label for="m-term">终止其余 ${others.length} 台保留候选</label></div>
    <div class="chk"><input id="m-protect" type="checkbox"${defProtect ? " checked" : ""}>
      <label for="m-protect">为选定实例开启 API 停止保护和终止保护</label></div>
    <div class="actions" style="justify-content:flex-end">
      <button class="btn" id="m-cancel" type="button">取消</button>
      <button class="btn primary" id="m-ok" type="button">确认选定</button>
    </div></div></div>`;
  $("#m-cancel").addEventListener("click", () => root.innerHTML = "");

    const btn = $("#m-ok"); btn.disabled = true; btn.textContent = "处理中…";
    try {
      const sel = await post(`/api/runs/${state.runId}/select`, {

    } catch(e){ showError("选定失败：" + e.message); btn.disabled = false; btn.textContent = "确认选定"; }
  });
}

// ---------- ⑥ 完成 ----------
function mountDone(){
  const c = $("#content"); const sel = state.selection;
  if (!sel){ c.innerHTML = `<div class="empty">尚未选定实例。</div>`; return; }
  const w = (state.report.winners || []).find(x => x.instance_id === sel.selected) || {};
  const id = state.runId;
  const tags = [`crossborder-winner=true`];
  if (w.composite != null) tags.push(`crossborder-score=${w.composite}`);
  const cmdStop = `aws ec2 modify-instance-attribute --region ${runRegion()} --instance-id ${sel.selected} --no-disable-api-stop`;
  const cmdTerm = `aws ec2 modify-instance-attribute --region ${runRegion()} --instance-id ${sel.selected} --no-disable-api-termination`;
  const winnerIds = (state.report.winners || []).map(x => x.instance_id);
  const alreadyTerm = new Set(sel.terminated || []);
  const others = winnerIds.filter(x => x !== sel.selected && !alreadyTerm.has(x));
  const cmdCleanup = `python -m crossborder_selector.cli cleanup --region ${runRegion()} --run-id ${id}`;
  c.innerHTML = `
    <h2>已完成选定</h2>
    <p class="step-desc">已选定实例。请根据业务需要配置应用，并保留测量报告。</p>
    <div class="card"><h3>选定实例</h3><div class="kv">
      <div class="k">实例 ID</div><div class="v mono">${esc(sel.selected)}</div>
      <div class="k">公网 IP</div><div class="v mono">${esc(w.public_ip || "")}</div>
      <div class="k">网段（CIDR）</div><div class="v mono">${esc(w.prefix || "")}</div>
      <div class="k">综合分</div><div class="v">${fmt(w.composite)}</div>
      <div class="k">停止 / 终止保护</div><div class="v">${sel.protection ? `${sel.protection.stop ? "已开启" : "未开启"} / ${sel.protection.termination ? "已开启" : "未开启"}` : sel.protected ? "旧记录未分别确认，请在 EC2 核查" : "本次未设置"}</div>
      <div class="k">已终止其余</div><div class="v mono">${esc((sel.terminated || []).join(", ")) || "无"}</div>
      <div class="k">标签</div><div class="v"><div class="tags">${tags.map(t => `<span class="pill neutral">${esc(t)}</span>`).join("")}</div></div>
    </div></div>
    <details class="card"><summary>实例使用与保护设置</summary><ul class="notes">
      <li>如需保留自动分配的公网 IPv4，应保持实例运行；停止后再启动通常会分配新 IP，重启通常保留 IP。</li>
      <li>工具仅完成实例筛选；业务部署、服务端口与访问控制需另行配置。</li>
      <li>它保留运行归属标签并标记 crossborder-winner=true，按运行 ID 清理会排除该实例。</li>
      <li>如需解除保护，以下两条命令分别关闭 API 停止保护和终止保护：</li>
    </ul>
    <pre class="cmd">${esc(cmdStop)}\n${esc(cmdTerm)}</pre></details>
    <div class="card"><h3>清理其余保留候选</h3>
      <p class="step-desc">${others.length ? `本次仍保留 ${others.length} 台其余候选，可一并终止：` : "没有需要清理的其余保留候选。"}</p>
      ${others.length ? `<div class="iplist">${others.map(esc).join("、")}</div>` : ""}
      <div class="actions">${others.length ? `<button class="btn danger" id="done-term" type="button">终止其余保留候选</button>` : ""}
        <span id="term-note" class="pill neutral" hidden></span></div>
      <details><summary class="compact-note">清理临时候选的命令</summary><p class="compact-note">此命令排除已标记为保留的实例。</p><pre class="cmd">${esc(cmdCleanup)}</pre></details></div>
    <div class="card"><h3>下载报告</h3><div class="actions" style="margin-top:0">
      <a class="btn" href="/api/runs/${encodeURIComponent(id)}/report.json" download>report.json</a>
      <a class="btn" href="/api/runs/${encodeURIComponent(id)}/report.md" download>report.md</a>
      <a class="btn" href="/api/runs/${encodeURIComponent(id)}/report.csv" download>candidates.csv</a>

      <button class="btn" id="done-hist" type="button">查看历史运行</button>

  const dt = $("#done-term");

// ---------- 历史运行侧栏 ----------
async function refreshHistory(){
  let runs;
  try { runs = await api("/api/runs"); } catch(e){ return; }
  const list = $("#hist-list"); const cnt = $("#hist-count");
  cnt.hidden = !runs.length; cnt.textContent = runs.length;
  if (!runs.length){ list.innerHTML = `<div class="empty">暂无运行记录</div>`; return; }
  const pillClass = {finished:"good", cancelled:"warn", failed:"bad", running:"run", unknown:"neutral"};
  const pillText = {finished:"已完成", cancelled:"已取消", failed:"失败", running:"运行中", unknown:"状态未知"};
  list.innerHTML = runs.map(r => {
    const nw = (r.winners || []).length;
    return `<div class="run-item${r.run_id === state.runId ? " cur" : ""}" data-run="${esc(r.run_id)}" data-state="${esc(r.state)}">
      <div class="rid">${esc(r.run_id)}</div>
      <div class="sub"><span class="pill ${pillClass[r.state] || "neutral"}">${esc(pillText[r.state] || r.state)}</span>
        <span>${esc(r.region || "")}</span><span>测量结束时保留 ${nw} 台</span></div></div>`;
  }).join("");
  list.querySelectorAll(".run-item").forEach(item => item.addEventListener("click", () => openRun(item.dataset.run, item.dataset.state)));
}
async function openRun(id, knownState){
  clearError(); closeStreams();
  let d;
  try { d = await api(`/api/runs/${id}`); } catch(e){ showError("载入运行失败：" + e.message); return; }
  state.runId = id; state.runDetail = d; state.report = null; state.selection = d.selection || null; location.hash = "run=" + id;
  const st = d.state || knownState;
  state.runState = st;
  if (st === "running"){
    state.maxRounds = (d.config && d.config.max_rounds) || state.maxRounds;
    state.rounds = []; state.logLines = []; state.runStartMs = Date.parse(d.started_at) || Date.now(); state.following = true;
    (d.events || []).forEach(applyEventQuiet);
    goStep(4); connectSSE(id);
  } else if (st === "failed"){
    goStep(4); showFailed(d.error, d.leftover_instance_ids ?? null, (d.winners || []).map(w => w.instance_id));
  } else if (st === "unknown"){
    showError("该运行状态未知（服务可能重启过）。如担心有遗留实例，请对其执行清理。");
    try { state.report = await api(`/api/runs/${id}/report.json`); enterResult(id); }
    catch(_){ goStep(4); showFailed("服务重启后无法确认该运行状态。", null); }
  } else {
    enterResult(id);
  }
}

// ---------- 初始化 ----------
async function init(){
  try {
    const meta=await api("/api/meta");
    state.regions=meta.regions || []; state.region=meta.default_region || state.region; state.demo=!!meta.demo;
    state.options={defaults:meta.defaults,backends:meta.backends,instance_types:[],errors:[]};initForm();
    if(state.demo) $("#demo-banner").hidden=false;
    if(meta.allow_remote) $("#service-note").textContent="已启用远程访问；服务没有身份认证。";
  } catch(e){showError("无法读取配置："+e.message);return;}
  refreshAwsIdentity();
  goStep(2);
  loadOptions().then(()=>{if(state.step===2)refreshCapacity();});
  api("/api/regions").then(data=>{
    state.regions=data.regions || state.regions;
  }).catch(()=>{});
  await refreshHistory();setInterval(refreshHistory,10000);
  const m=location.hash.match(/run=([A-Za-z0-9-]+)/);
  if(m){openRun(m[1]);return;}
  let runs=[];try{runs=await api("/api/runs");}catch(_){}
  const running=runs.find(r=>r.state==="running");
  if(running) openRun(running.run_id,"running");
}
window.addEventListener("DOMContentLoaded", init);
</script>
